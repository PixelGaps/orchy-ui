services:
  - type: web
    name: orchy-ui
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ORCHY_DEPLOYMENT_PROTECTION
        value: enabled
      - key: ORCHY_OPERATOR_SUBJECT
        value: dave
      - key: GITHUB_REPOSITORY
        value: PixelGaps/orchy
      - key: TESTOPS_TARGET
        value: PixelGaps/orchy
      - key: SUPABASE_URL
        value: https://ooufawymcnguiuzymbjf.supabase.co
      - key: JIRA_BASE_URL
        value: https://espalwebs.atlassian.net
      - key: JIRA_EMAIL
        sync: false
      - key: JIRA_API_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: POSTHOG_SUMMARY_URL
        sync: false
      - key: POSTHOG_PERSONAL_API_KEY
        sync: false
