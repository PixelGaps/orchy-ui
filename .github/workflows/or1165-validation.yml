name: OR-1165 Route Validation
on:
  push:
    branches: ['task/OR-1165-image-route-fixture-v2']
permissions:
  contents: read
jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npx playwright test e2e/routes.spec.ts -g "/image-factory renders its owning domain page"
