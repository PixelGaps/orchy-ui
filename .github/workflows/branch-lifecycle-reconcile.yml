name: Branch Lifecycle Reconcile
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: branch-lifecycle-reconcile
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Remove integrated task refs and surface unmanaged refs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/branch_lifecycle.py
